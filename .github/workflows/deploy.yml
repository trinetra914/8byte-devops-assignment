name: Build, Scan and Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 8byte-devops-app
  EC2_INSTANCE_ID: i-054dae028a48968be
  CONTAINER_NAME: 8byte-devops-container
  ECR_REGISTRY: 777040315554.dkr.ecr.ap-south-1.amazonaws.com

jobs:

  # ============================================================
  # 1. Build and scan Docker image
  # ============================================================

  build-and-scan:
    name: Build and Scan Docker Image
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const parts = token.split('.');
            const payload = JSON.parse(
              Buffer.from(parts[1], 'base64url').toString()
            );

            console.log("===== OIDC TOKEN CLAIMS =====");
            console.log("iss:", payload.iss);
            console.log("aud:", payload.aud);
            console.log("sub:", payload.sub);
            console.log("repository:", payload.repository);
            console.log("repository_owner:", payload.repository_owner);
            console.log("ref:", payload.ref);
            console.log("ref_type:", payload.ref_type);
            console.log("event_name:", payload.event_name);
            console.log("=============================");

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::777040315554:role/8byte-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REPOSITORY }}:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Docker image to ECR
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      - name: Save image reference
        id: image
        run: |
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" >> "$GITHUB_OUTPUT"


  # ============================================================
  # 2. Deploy to staging
  # ============================================================

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-scan
    runs-on: ubuntu-latest

    environment:
      name: staging

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::777040315554:role/8byte-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Show image to deploy
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image }}
        run: |
          echo "Image received from build job:"
          echo "$IMAGE"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: IMAGE is empty."
            exit 1
          fi

      - name: Deploy application to staging EC2
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker stop $CONTAINER_NAME || true\",
              \"docker rm $CONTAINER_NAME || true\",
              \"docker run -d --restart unless-stopped --name $CONTAINER_NAME -p 5000:5000 $IMAGE\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Staging health check
        run: |
          echo "Waiting for staging application..."
          sleep 15

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://13.207.41.61:5000/health")

          echo "Staging health endpoint returned: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Staging health check failed."
            exit 1
          fi

          echo "Staging deployment successful."


  # ============================================================
  # 3. Production deployment
  # ============================================================

  deploy-production:
    name: Deploy to Production

    needs:
      - build-and-scan
      - deploy-staging

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::777040315554:role/8byte-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Show image to deploy
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image }}
        run: |
          echo "Image received from build job:"
          echo "$IMAGE"

          if [ -z "$IMAGE" ]; then
            echo "ERROR: IMAGE is empty."
            exit 1
          fi

      - name: Deploy approved image to production
        env:
          IMAGE: ${{ needs.build-and-scan.outputs.image }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",
              \"docker pull $IMAGE\",
              \"docker stop $CONTAINER_NAME || true\",
              \"docker rm $CONTAINER_NAME || true\",
              \"docker run -d --restart unless-stopped --name $CONTAINER_NAME -p 5000:5000 $IMAGE\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          echo "Production SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"

      - name: Production health check
        run: |
          echo "Waiting for production application..."
          sleep 15

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "http://13.207.41.61:5000/health")

          echo "Production health endpoint returned: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "Production health check failed."
            exit 1
          fi

          echo "Production deployment successful."


  # ============================================================
  # 4. Failure notification
  # ============================================================

  notify-failure:
    name: Notify on Failure

    needs:
      - build-and-scan
      - deploy-staging
      - deploy-production

    if: ${{ always() && contains(needs.*.result, 'failure') }}

    runs-on: ubuntu-latest

    steps:

      - name: Notify deployment failure
        run: |
          echo "Deployment pipeline failed."
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_number }}"
          echo "Please check the GitHub Actions logs."

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Deployment pipeline failed!\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.run_number }}\nPlease check GitHub Actions logs."
            }